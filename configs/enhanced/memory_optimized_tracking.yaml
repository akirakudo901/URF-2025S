# Memory-Optimized Enhanced GPT2VQVAE Configuration
# This configuration disables expensive tracking features to save memory while
# keeping essential monitoring enabled.

model_config:
  # ============================================================================
  # Core Model Parameters
  # ============================================================================
  vocab_size: 50257          # GPT2 vocabulary size
  d_model: 768              # GPT2 model dimension
  n_positions: 1024         # Maximum sequence length for GPT2
  
  # ============================================================================
  # VQ-VAE Specific Parameters
  # ============================================================================
  num_embeddings: 1024       # VQ codebook size
  commitment_cost: 0.25     # VQ commitment cost
  aggregation_hidden_dim: 1024  # Aggregation MLP hidden dimension
  num_thoughts: 2          # Number of parallel sequences
  
  # ============================================================================
  # Enhanced Vector Quantizer Parameters
  # ============================================================================
  ema_decay: 0.99           # EMA decay rate for codebook updates
  diversity_gamma: 0.1      # Weight for diversity-promoting loss
  reset_threshold: 0.1      # Threshold for codebook reset (usage ratio)
  reset_frequency: 1000     # Frequency of checking for codebook reset
  use_ema: true             # Whether to use EMA updates
  max_reset_steps: null     # Maximum training steps during which resets are allowed (None = no limit)
  reservoir_size: 10000     # Size of reservoir for data-dependent initialization
  reset_strategy: 'partial' # Strategy for automatic resets - 'partial' or 'full'
  use_batch_norm: false      # Whether to use batch normalization before vector quantization
  reset_stop_fraction: 0.2  # Fraction of training during which resets are allowed
  
  # ============================================================================
  # Unified parameters (applied to both encoder and decoder)
  # ============================================================================
  n_layer: null               # Number of hidden layers for both encoder and decoder
  n_head: null                # Number of attention heads for both encoder and decoder
  n_inner: null             # Dimensionality of inner feed-forward layers (None = 4*d_model)
  dropout: null              # Dropout probability for both encoder and decoder
  activation_function: null # Activation function for both encoder and decoder
  
  # ============================================================================
  # Encoder-specific parameters (take precedence over unified if specified)
  # ============================================================================
  encoder_n_layer: 6     # Number of hidden layers in the encoder (None = use unified)
  encoder_n_head: 12      # Number of attention heads for encoder (None = use unified)
  encoder_n_inner: null     # Dimensionality of encoder inner feed-forward layers (None = use unified)
  encoder_dropout: 0.1     # Dropout probability for encoder (None = use unified)
  encoder_activation_function: gelu # Activation function for encoder (None = use unified)
  
  # ============================================================================
  # Decoder-specific parameters (take precedence over unified if specified)
  # ============================================================================
  decoder_n_layer: 12       # Number of hidden layers in the decoder (None = use unified)
  decoder_n_head: 12        # Number of attention heads for decoder (None = use unified)
  decoder_n_inner: null     # Dimensionality of decoder inner feed-forward layers (None = use unified)
  decoder_dropout: 0.1      # Dropout probability for decoder (None = use unified)
  decoder_activation_function: gelu # Activation function for decoder (None = use unified)
  
  # ============================================================================
  # Pretrained model settings
  # ============================================================================
  use_pretrained_encoder: false   # Whether to load pretrained weights for encoder
  use_pretrained_decoder: true   # Whether to load pretrained weights for decoder
  pretrained_model_name: gpt2  # Name of pretrained model to load

training_config:
  # ============================================================================
  # Basic Training Parameters
  # ============================================================================
  learning_rate: 1e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  use_lr_scheduler: true
  min_lr: 1e-6
  num_epochs: 5
  batch_size: 32
  gradient_clip: 1.0
  vq_loss_weight: 1.0
  quantize_cot_only: true
  save_every: 1
  checkpoint_dir: 'checkpoints/enhanced/test_memory_optimized'
  pad_token_id: 50256
  val_split: 0.1
  num_measurements_per_epoch: 10
  
  # ============================================================================
  # Memory Optimization Settings
  # ============================================================================
  use_mixed_precision: true
  gradient_accumulation_steps: 1
  use_gradient_checkpointing: true
  use_dynamic_batching: false
  max_tokens_per_batch: 8192
  max_samples: 10000
  
  # ============================================================================
  # Perplexity Threshold Settings
  # ============================================================================
  perplexity_threshold: 0
  perplexity_window_size: 20
  minimum_batches_for_checkpoint: 200
  
  # ============================================================================
  # Data Configuration
  # ============================================================================
  data_dir: 'data/GSM8K/128_128/batch_2'
  
  # ============================================================================
  # Enhanced Codebook Tracking (Memory Optimized)
  # ============================================================================
  enhanced_codebook_tracking: false
  
  # Granular tracking control for memory optimization
  codebook_tracking_config:
    # Essential tracking (enabled)
    track_usage_stats: true        # Track basic usage statistics (lightweight)
    track_reset_stats: true        # Track reset statistics (lightweight)
    print_tracking_info: true      # Print basic tracking information
    
    # Expensive tracking (disabled to save memory)
    track_diversity_metrics: false # Disable diversity metrics (computes similarity matrices)
    track_ema_stats: false         # Disable EMA statistics (large tensor operations)
    track_reservoir_stats: false   # Disable reservoir statistics (CPU memory)
    save_tracking_history: false   # Don't save history to save memory
    
  # ============================================================================
  # Profiler Configuration (Optional)
  # ============================================================================
  profiler_enabled: false
  profiler_schedule:
    wait: 0
    warmup: 1
    active: 2
    repeat: 1 

  # ============================================================================
  # Phased Training Parameters
  # ============================================================================
  # one epoch = 1743 steps
  initialization_steps: 200          # Steps to train in no-vq mode
  r_reestim: 100                     # Frequency of codebook reinitialization
  quantization_start: 500           # Step to start normal VQ training
  codebook_lr_multiplier: 1.0        # Codebook learning rate multiplier

  profiler_enabled: false